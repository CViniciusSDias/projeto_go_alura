name: "Construção do artefato"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Informamos que queremos utilizar como ambiente a versão mais recente do ubuntu dentro
    # do servidor do github actions:
    runs-on: ubuntu-latest
    # Passos do meu job:
    steps:
      # A Action abaixo faz um git clone do nosso projeto e acessa a pasta do projeto
      # normalmente chamdo de "workflow":
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: cviniciussdias
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Constrói e envia imagem docker
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: cviniciussdias/projeto_go:latest,cviniciussdias/projeto_go:${{ github.sha }}
